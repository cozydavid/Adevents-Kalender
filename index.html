<!DOCTYPE html>

<html lang="de">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cozy Adventskalender 🎄</title>
        <meta name="theme-color" content="#172820">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="snow" aria-hidden="true"></div>
        <header class="hero">
            <p class="eyebrow">✨ A LITTLE CHRISTMAS MAGIC ✨</p>
            <h1>Mein kleiner<br><span>Adventskalender</span></h1>

            <p class="subtitle">
                24 kleine Momente voller Weihnachtszauber.
            </p>

            <div class="divider">
                <span>✦</span>
                <span class="divider-line"></span>
                <span>❄</span>
                <span class="divider-line"></span>
                <span>✦</span>
            </div>

            <p class="instruction">
                Wähl ein Türchen und lass dich überraschen.
            </p>
        </header>

        <main>
            <section class="calendar" id="calendar" aria-label="Adventskalender"><!-- Die 24 Türchen werden mit JavaScript erstellt. --></section>
        </main>
        <footer>
            <p>Made with ♡ and a little Christmas magic</p>
            <p class="footer-decoration">🌲 ✧ 🕯️ ✧ 🌲</p>
        </footer>
    </body>
</html>
